# Coded by ueha
# Gate-сервер (role 1). Публичный вход: игроки подключаются сюда, проходят
# капчу и редиректятся на игровой порт. ipc_secret ДОЛЖЕН совпадать с server.cfg.
sv_name "Aegis Gate"
sv_map dm1
sv_sqlite_file gate_scores.db
sv_port 8304
sv_register 0
sv_rcon_password "CHANGE_ME_RCON"

sv_captcha_srv_mode 1
sv_captcha_srv_role 1
sv_captcha_srv_game_port 8303
sv_captcha_srv_gate_port 8304
sv_captcha_srv_ipc_port 8305
sv_captcha_srv_ipc_path "captcha_whitelist.txt"
sv_captcha_srv_ipc_secret "CHANGE_ME_SECRET"
sv_captcha_srv_digits 6
sv_captcha_srv_answer_sec 60
sv_captcha_srv_concurrent 16
sv_captcha_srv_queue_max 64
sv_captcha_srv_max_fails 5
sv_captcha_srv_fail_window_sec 120
